// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {

//        kotlin_version = '1.3.72'
//        kotlin_version = '1.4.0'
        kotlin_version = '1.9.24'
        ext.anko_version='0.10.8'

        kotlinVersion = '1.3.50'
        appCompatVersion = "1.1.0"
        recyclerVersion = "1.1.0-rc01"
        materialVersion = "1.1.0-beta01"
        navigationVersion = "2.1.0"
        constraintLayoutVersion = "2.0.0-beta3"

        println("20200921b-build.gradle-ext-01->")
    }
    repositories {

        maven { url 'https://jitpack.io' }
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        google()
    }
    dependencies {
        ////classpath 'com.android.tools.build:gradle:3.5.0-beta04'
        ////classpath 'com.android.tools.build:gradle:3.2.1'
//        classpath 'com.android.tools.build:gradle:3.2.1'
//        classpath 'com.android.tools.build:gradle:3.4.1'
        classpath 'com.android.tools.build:gradle:7.2.2'


//        classpath 'com.android.tools.build.jetifier:jetifier-core:1.0.0-beta04'
//        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
//        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    println("---3d3de---version:"+version)
}

plugins {
    id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        jcenter()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
